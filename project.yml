name: DailyHadith
options:
  bundleIdPrefix: com.blockchainhb
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  DailyHadith:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DailyHadithApp
        excludes:
          - Resources/**
      - path: DailyHadithApp/Resources/hadiths.reviewed.json
        buildPhase: resources
      - path: DailyHadithApp/Resources/Audio
        type: folder
        buildPhase: resources
      - path: DailyHadithApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: DailyHadithApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: DailyHadithApp/Info.plist
      properties:
        CFBundleDisplayName: Daily Hadith
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockchainhb.dailyhadith
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G2537ZRGNU
schemes:
  DailyHadith:
    build:
      targets:
        DailyHadith: all
    run:
      config: Debug
